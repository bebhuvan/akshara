# "Three more to begin with": a book and a sentence from it, with where the sentence comes from.
[[begin_with]]
book = "speeches-writings-sarojini-naidu"
quote = "I was born in Bengal. I belong to the Madras Presidency. In a Mahomedan city I was brought up and married and there I lived; still I am neither a Bengalee, nor Madrassee, nor Hyderabadee but I am an Indian."
source = "From her speech *True Brotherhood*"

[[begin_with]]
book = "indian-shipping"
quote = "Do thou whose countenance is turned to all sides send off our adversaries as if in a ship to the opposite shore; do thou convey us in a ship across the sea for our welfare."
source = "The Rig Veda, to Agni, as Mookerji quotes it"

[[begin_with]]
book = "lays-of-ancient-india"
verse = true
quote = "Beauteous daughter of the sky!<br>Hold thy ruddy light on high!<br>Grant us wealth and grant us day,<br>Bring us food with morning’s ray!"
source = "*Ushas, or the Dawn*, from the Rig Veda"

