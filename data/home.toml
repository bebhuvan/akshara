# Hand-chosen things on the opening page. Every book and plate named here must exist, or the build stops.
# Plain keys must come before the first [table], or TOML files them under it.

# "Small things from the books": plate keys from data/plates.toml. Each opens the book it came from.
cabinet = ["per-pallava", "j1-krishna", "eic-ship", "pal-jones"]

# The book the opening's "Begin reading" opens, at its first chapter.
begin = "journey-from-madras-vol-i"

# The turning plate at the top of the page: plate keys from data/plates.toml, in the order they turn,
# each with the caption set beneath it (its name, then where it was printed).
[[turning]]
plate = "j2-chakram"
title = "Chakram of Chowgaut"
line = "Plate xx, fig. 51 · Buchanan, *A Journey from Madras*, 1807"

[[turning]]
plate = "per-ship"
title = "Merchant-ship of the second century"
line = "From a relief in the Lateran Museum · Schoff, *The Periplus*, 1912"

[[turning]]
plate = "et-coryat"
title = "Coryat on an elephant"
line = "Foster, *Early Travels in India*, 1921, p. 248"

[[turning]]
plate = "pal-narasimha"
title = "Inscription of Nayapāla, the year 15"
line = "Rubbing · Banerji, *The Pālas of Bengal*, 1915"

[[turning]]
plate = "j3-fish"
title = "Cyprinus curmuca"
line = "Plate xxx · Buchanan, *A Journey from Madras*, vol. III"

[[turning]]
plate = "j2-bull"
title = "Seringapatam bull, from the late Sultan’s herd"
line = "Fig. 38 · Buchanan, *A Journey from Madras*, vol. II, p. 7"

# The featured edition: one book shown properly. Its words are the editor's (D6 allows the curated
# text on this page); the quotation is the book's own first sentence, with where it stands.
[featured]
book = "journey-from-madras-vol-i"
title = "A Journey from Madras through the Countries of Mysore, Canara, and Malabar"
by = "Francis Buchanan · London, 1807 · three volumes"
quote = "In the afternoon of the 23d April 1800, I set out from Madras, in the very hot dry weather, which usually prevails at this season."
quote_source = "The day the survey began · vol. I, p. 1"
about = "Seringapatam had fallen the year before. The Company sent Buchanan, a Scottish physician, through Mysore, Canara and Malabar to write down how the country lived: its crops and wells, its mills and looms, its weights, coins and rents. This is his journal of the road, with the engravings made from his drawings."

# Three of its plates beneath, with short captions.
[[featured.plates]]
plate = "j1-sugarmill"
caption = "Sugar mill, fig. 34"

[[featured.plates]]
plate = "j2-bull"
caption = "Seringapatam bull, vol. II, fig. 38"

[[featured.plates]]
plate = "j3-fish"
caption = "Cyprinus curmuca, vol. III, plate xxx"
