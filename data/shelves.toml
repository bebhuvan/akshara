# The eight shelves. A book's shelf comes from its `archetype` front matter (set by the pipeline).
# The order here is the order on the site. Each shelf has one cloth colour, and from it four colours that
# every page uses: its paper and ink, light and dark. `code` names the CSS class that carries them; the build
# writes those classes from this file (assets/css/shelves.css), and the social cards read the same values,
# so a shelf's colours live here and nowhere else. A new shelf needs only an entry here.

[[shelf]]
key = "epistolary_and_speeches"
code = "le"
paper = "#F0E4E6"       # the cloth washed pale: covers, tiles, bands
ink = "#774353"         # the cloth deepened to read as text on white and on its paper
paper_dark = "#36262C"  # the same in dark mode: a ground a step above the dark page
ink_dark = "#CA9BA9"    # and an ink lifted toward the light (at least 5.5:1 on its ground)
name = "Literature and Letters"
slug = "literature-and-letters"
cloth_name = "madder"
cloth = "#9A5E6A"
epigraph = "I wonder what I should do without your dear letters; there would be such a gap in my everyday life, if I did not receive them."
source = "Toru Dutt, to Mary Martin, 1877"

