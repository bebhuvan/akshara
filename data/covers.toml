# Each book's cover: what kind it is, and which of its own pictures it carries.
# Read by layouts/_partials/book/record.html; checked by tests/test_covers.py and by the build.
#
#   kind   plate (an engraving, printed large), map (kept whole in a fine rule), device (arms, seal or
#          printer's device from the title page), portrait (a frontispiece in an oval), photo (a
#          frontispiece photograph in a frame), type (no picture: the title alone makes the cover)
#   plate  a key in static/plates/: the cleaned one-ink picture. It must come from THIS book
#          (data/plates.toml or data/plate_sources.toml records where each plate came from).
#   inset  optional: where the picture sits on the cover, as CSS inset (top right bottom left),
#          when the kind's usual place does not suit its shape.
#   line   optional: the italic second line of the cover label (a volume, or the years covered).
#   why    for type covers: why there is no picture yet.
#
# Started from the 63-book cover audit (design_directions/2026-11-redesign/cover-plan.json).


