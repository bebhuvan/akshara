# Where each cover plate comes from, and how scripts/make_plates.py rebuilds it.
#
# One [[plate]] per plate in static/plates/<key>.webp. A plate is always a picture from the
# book it is credited to (never another volume or edition). Fields:
#   key     file name in static/plates (without .webp)
#   book    the book id (content/books/<book>)
#   source  a repo path under static/figures, or the full archive.org page image URL of that book's scan
#   crop    [left, top, right, bottom] as fractions of the source (after any rotate)
#   mode    "line" (engraving, map, device) or "halftone" (photograph, ordered dither)
#   levels  optional [black, white] points (0-255) after auto-contrast; otherwise measured
#   channel optional colour channel to read instead of grey ("blue" drops a blue library stamp)
#   blank   optional list of [l, t, r, b] boxes (fractions of the crop) painted out as paper
#   rotate  optional degrees counter-clockwise, for plates printed sideways
#   what    one line saying what the picture is and where it is in the book
#   made    instead of crop: the plate was made by hand and the script skips it

