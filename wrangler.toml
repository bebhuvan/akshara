# Akshara on Cloudflare Workers, as static assets only: no Worker script runs.
# Cloudflare serves public/ directly, reads public/_headers and public/_redirects, and answers an
# unknown address with public/404.html and a real 404 status (see DECISIONS.md, D3).
# Docs: https://developers.cloudflare.com/workers/static-assets/

name = "akshara"
compatibility_date = "2026-11-01"

[assets]
directory = "./public"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"

[env.production]
name = "akshara"
routes = [
  { pattern = "akshara.ink/*", zone_name = "akshara.ink" },
  { pattern = "www.akshara.ink/*", zone_name = "akshara.ink" }
]

# A private preview for checking a redesign before it goes live: npx wrangler deploy --env preview
[env.preview]
name = "akshara-preview"
