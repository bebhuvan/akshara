baseURL = "https://akshara.ink/"
locale = "en-IN"
title = "Akshara"

buildFuture = false
buildExpired = false
buildDrafts = false
enableRobotsTXT = false

# /authors/ is a section of author pages; the old theme, period and language groupings were retired
# on 2026-11-21 (they were empty or listed authors by the languages they knew) and redirect in static/_redirects.
[taxonomies]
  author = "authors"

[permalinks]
  authors = "/authors/:slug"

# Chapters come from the book pipeline as Markdown with HTML in it (margin notes, folio marks,
# footnotes, tables). That HTML is written by our own compiler, never by readers, so it is allowed.
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser.attribute]
      block = true

[outputs]
  home = ["HTML", "RSS"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[sitemap]
  changeFreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[services.rss]
  limit = 20

[minify]
  disableJS = false
  [minify.tdewolff.html]
    keepWhitespace = false

[params]
  description = "Making India’s forgotten books readable again: travels, Company records, famine reports, village life, Vedic hymns, speeches and letters, long out of print, set to be read and free to all."
  author = "Akshara"
  featured_book = "india-at-the-death-of-akbar"
  proofing_url = "https://akshara-proofing.r-bhuvanesh2007.workers.dev"
