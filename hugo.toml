baseURL = "https://akshara.ink/"
locale = "en-IN"
title = "Akshara"

buildFuture = false
buildExpired = false
buildDrafts = false
enableRobotsTXT = false

# No taxonomies. /authors/ is a section of author pages (content/authors/); an "authors" taxonomy of the
# same name hid it, leaving the page empty. The old theme, period and language groupings were retired on
# 2026-11-21 and redirect in static/_redirects.
disableKinds = ["taxonomy", "term"]



[permalinks]
  authors = "/authors/:slug"

# Chapters come from the book pipeline as Markdown with HTML in it (margin notes, folio marks,
# footnotes, tables). That HTML is written by our own compiler, never by readers, so it is allowed.
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser.attribute]
      block = true

[outputs]
  home = ["HTML", "RSS"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[sitemap]
  changeFreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[services.rss]
  limit = 20

[minify]
  disableJS = false
  [minify.tdewolff.html]
    keepWhitespace = false

[params]
  description = "Making India’s forgotten books readable again: travels, Company records, famine reports, village life, Vedic hymns, speeches and letters, long out of print, set to be read and free to all."
  author = "Akshara"
  featured_book = "india-at-the-death-of-akbar"
  proofing_url = "https://proof.akshara.ink"

  # The licence of every Akshara edition (D26). The books themselves are in the public domain.
  license_name = "CC BY 4.0"
  license_title = "Creative Commons Attribution 4.0 International"
  license_url = "https://creativecommons.org/licenses/by/4.0/"

  # Shown in the footer as "Bhuvan elsewhere".
  [[params.elsewhere]]
    name = "Twitter"
    url = "https://twitter.com/bebhuvan"
  [[params.elsewhere]]
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/bebhuvan/"
  [[params.elsewhere]]
    name = "GitHub"
    url = "https://github.com/bebhuvan"

# The plates are served as they are from static/plates, and are also mounted as assets so the build can
# make the social preview images and smaller copies from them (layouts/_partials/plate/). The two default
# mounts are listed because adding any mount replaces them.
[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static/plates"
    target = "assets/plates"
  [[module.mounts]]
    source = "static"
    target = "static"
