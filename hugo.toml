baseURL = "https://akshara.ink/"
locale = "en-IN"
title = "Akshara"

buildFuture = false
buildExpired = false
buildDrafts = false
enableRobotsTXT = false

# These four taxonomies have live addresses (/authors/, /themes/, /periods/, /languages/), so they stay.
[taxonomies]
  author = "authors"
  theme = "themes"
  period = "periods"
  language = "languages"

[permalinks]
  authors = "/authors/:slug"

# Chapters come from the book pipeline as Markdown with HTML in it (margin notes, folio marks,
# footnotes, tables). That HTML is written by our own compiler, never by readers, so it is allowed.
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser.attribute]
      block = true

[outputs]
  home = ["HTML", "RSS"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[sitemap]
  changeFreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[services.rss]
  limit = 20

[minify]
  disableJS = false
  [minify.tdewolff.html]
    keepWhitespace = false

[params]
  description = "Rare books about India, set again with care and given to everyone. Each is read afresh from photographs of its pages and kept page by page beside its scan."
  author = "Akshara"
  featured_book = "india-at-the-death-of-akbar"
  proofing_url = "https://akshara-proofing.r-bhuvanesh2007.workers.dev"
