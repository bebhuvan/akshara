# Akshara: check every push; deploy to Cloudflare only from main.
# Third-party actions are pinned to a commit, so a changed tag cannot change what runs here.
name: Verify and deploy

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install Hugo (version from .hugo-version, checksum verified)
        run: |
          V="$(cat .hugo-version)"
          F="hugo_extended_${V}_linux-amd64.tar.gz"
          curl -sSfLO "https://github.com/gohugoio/hugo/releases/download/v${V}/${F}"
          curl -sSfLO "https://github.com/gohugoio/hugo/releases/download/v${V}/hugo_${V}_checksums.txt"
          grep " ${F}\$" "hugo_${V}_checksums.txt" | sha256sum -c -
          tar -xzf "${F}" hugo && sudo mv hugo /usr/local/bin/ && hugo version

      - name: Install tools (frozen, no install scripts)
        run: npm ci --ignore-scripts

      - name: Verify
        run: ./verify

      - name: Deploy to Cloudflare
        if: github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production
