<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "en" }}">
<head>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('akshara-theme') || localStorage.getItem('theme') || 'light';
          if (t === 'dark' || t === 'sepia') {
            document.documentElement.dataset.theme = t;
          } else {
            document.documentElement.dataset.theme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    {{ partial "head.html" . }}
</head>
<body class="{{ if eq .Type "books" }}is-book-page{{ end }}{{ if eq .Type "chapters" }} is-reading-page{{ end }}">
    {{ block "main" . }}{{ end }}
    <script>
      (function() {
        var t = document.documentElement.dataset.theme || 'light';
        if (t !== 'light') document.body.classList.add(t);
        function applyTheme(next) {
          document.body.classList.remove('dark', 'sepia');
          if (next !== 'light') document.body.classList.add(next);
          document.documentElement.dataset.theme = next;
          try {
            localStorage.setItem('akshara-theme', next);
            localStorage.setItem('theme', next);
          } catch (e) {}
          document.querySelectorAll('[data-theme-pick]').forEach(function(btn) {
            btn.classList.toggle('is-active', btn.dataset.themePick === next);
            btn.setAttribute('aria-pressed', btn.dataset.themePick === next ? 'true' : 'false');
          });
        }
        window.AksharaTheme = { apply: applyTheme, current: function() { return document.documentElement.dataset.theme || 'light'; } };
        document.addEventListener('DOMContentLoaded', function() {
          applyTheme(document.documentElement.dataset.theme || 'light');
          document.querySelectorAll('[data-theme-pick]').forEach(function(btn) {
            btn.addEventListener('click', function() { applyTheme(btn.dataset.themePick); });
          });
          var menuToggle = document.querySelector('.menu-toggle');
          var navPanel = document.querySelector('.nav-wrapper');
          if (menuToggle && navPanel) {
            menuToggle.addEventListener('click', function() {
              var open = navPanel.classList.toggle('is-open');
              menuToggle.classList.toggle('is-active', open);
              document.body.classList.toggle('menu-open', open);
            });
          }
          document.addEventListener('keydown', function(e) {
            if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
              var bookSearch = document.getElementById('bookSearchInput');
              if (bookSearch) {
                e.preventDefault();
                if (typeof openMenuAndFocusSearch === 'function') openMenuAndFocusSearch();
              } else if (window.location.pathname !== '/search/') {
                e.preventDefault();
                window.location.href = '/search/';
              }
            }
          });
        });
      })();
    </script>
</body>
</html>
