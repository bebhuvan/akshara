{{ define "main" }}
<section class="pg wrap">
  <header class="lib-head"><h1 class="lib-title">{{ .Title }}</h1>{{ with .Params.description }}<p class="lib-dek">{{ . }}</p>{{ end }}</header>
  <ol class="entries plain-list">{{ range .Pages }}<li><a class="entry" href="{{ .RelPermalink }}"><span class="what"><span class="ttl">{{ .Title }}</span></span></a></li>{{ end }}</ol>
</section>
{{ end }}
