{{ define "main" }}
<article class="wrap article su">
  <header class="pg-h">
    <p class="up"><a href="/blog/">The Journal</a> · {{ .Date.Format "2 January 2006" }}</p>
    <h1>{{ .Title }}</h1>
    {{- with .Description }}<p class="dek">{{ . }}</p>{{ end }}
  </header>
  <div class="pg-body prose">{{ .Content }}</div>
  <footer class="post-foot">
    <p class="sig"><span class="kn" lang="kn" aria-hidden="true">ಅಕ್ಷರ</span> Bhuvan</p>
    <nav class="pager" aria-label="Journal">{{ with .PrevInSection }}<a href="{{ .RelPermalink }}"><small>Later</small><b>{{ .Title }}</b></a>{{ end }}{{ with .NextInSection }}<a href="{{ .RelPermalink }}"><small>Earlier</small><b>{{ .Title }}</b></a>{{ end }}</nav>
  </footer>
</article>
{{ end }}
