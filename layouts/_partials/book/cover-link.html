{{- /* A cover that opens its book, with the short title and author beneath it. Takes a book record. */ -}}
{{- $b := . -}}
<a class="book {{ $b.code }}" href="{{ $b.url }}">{{ partial "book/cover.html" $b }}<span class="cap"><b>{{ $b.cover.title }}{{ with $b.cover.line }}, {{ . }}{{ end }}</b><span class="by">{{ $b.author }}</span></span></a>
{{- /**/ -}}
